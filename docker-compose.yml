
services:
  orders-db:
    container_name: orders_database
    image: postgres:16
    restart: always

    user: "1000:1000"

    volumes:
      - ./postgres:/var/lib/postgresql/data

    ports:
      - 5433:5432

    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=ordersdb
